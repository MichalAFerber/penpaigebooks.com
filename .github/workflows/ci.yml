name: ci

# §4: the gate lives on the pull request. This repo deployed from main with
# nothing checking a change first, so the deploy was the first thing to find out.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is the required-check context; the estate requires `ci`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every HTML file must parse
        run: |
          fail=0; n=0
          for f in $(git ls-files '*.html'); do
            n=$((n+1))
            python3 - "$f" <<'EOF' || fail=1
          import sys
          from html.parser import HTMLParser
          class P(HTMLParser):
              def error(self, m): raise ValueError(m)
          try:
              P().feed(open(sys.argv[1], encoding='utf-8').read())
          except Exception as e:
              print(f"::error file={sys.argv[1]}::{e}"); sys.exit(1)
          EOF
          done
          echo "checked $n HTML files"
          [ "$n" -gt 0 ] || { echo "::error::no HTML found — has the layout changed?"; exit 1; }
          exit $fail

      # DS §11: robots.txt names the sitemap index, and the sitemap lists every
      # indexable page (each with a lastmod) and nothing else. The sitemap is
      # hand-written, so this is what catches a page added without an entry.
      # Each indexable page carries exactly one canonical, in <head>, naming its
      # own sitemap URL (og:url, where present, names the same URL). A noindex
      # page carries none: a canonical there would contradict the noindex.
      - name: robots.txt, sitemaps, and canonicals
        run: |
          python3 <<'EOF'
          import pathlib, re, sys
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_head, self.canonicals, self.og_urls = False, [], []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag in ("head", "body"):
                      self.in_head = tag == "head"
                  elif tag == "link" and "canonical" in (a.get("rel") or "").lower().split():
                      self.canonicals.append((a.get("href"), self.in_head))
                  elif tag == "meta" and a.get("property") == "og:url":
                      self.og_urls.append(a.get("content"))
              def handle_endtag(self, tag):
                  if tag == "head":
                      self.in_head = False
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          site = "https://penpaigebooks.com"
          pub = pathlib.Path("public")
          errors = []
          if f"Sitemap: {site}/sitemap-index.xml" not in (pub / "robots.txt").read_text().splitlines():
              errors.append("robots.txt does not name the sitemap index")
          index = [e.text for e in ET.parse(pub / "sitemap-index.xml").findall("s:sitemap/s:loc", ns)]
          if index != [f"{site}/sitemap.xml"]:
              errors.append(f"sitemap-index.xml lists {index}, expected only {site}/sitemap.xml")
          listed = {}
          for u in ET.parse(pub / "sitemap.xml").findall("s:url", ns):
              lastmod = u.findtext("s:lastmod", namespaces=ns) or ""
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", lastmod):
                  errors.append(f"{u.findtext('s:loc', namespaces=ns)}: lastmod {lastmod!r} is not YYYY-MM-DD")
              listed[u.findtext("s:loc", namespaces=ns)] = lastmod
          pages = set()
          for f in pub.rglob("*.html"):
              text = f.read_text(encoding="utf-8")
              rel = f.relative_to(pub).as_posix()
              head = Head()
              head.feed(text)
              if f.name == "404.html" or re.search(r'<meta name="robots" content="[^"]*noindex', text):
                  if head.canonicals:
                      errors.append(f"{rel} is noindex but carries a canonical")
                  continue
              url = f"{site}/" + (rel[: -len("index.html")] if rel.endswith("index.html") else rel[: -len(".html")])
              pages.add(url)
              if len(head.canonicals) != 1:
                  errors.append(f"{rel} has {len(head.canonicals)} canonical links, expected exactly 1")
              elif not head.canonicals[0][1]:
                  errors.append(f"{rel}: the canonical link is outside <head>")
              elif head.canonicals[0][0] != url:
                  errors.append(f"{rel}: canonical {head.canonicals[0][0]!r} is not its sitemap URL {url}")
              for og in head.og_urls:
                  if og != url:
                      errors.append(f"{rel}: og:url {og!r} is not its canonical {url}")
          for p in sorted(pages - listed.keys()):
              errors.append(f"{p} is indexable but missing from sitemap.xml")
          for p in sorted(listed.keys() - pages):
              errors.append(f"sitemap.xml lists {p}, which is not an indexable page")
          for e in errors:
              print(f"::error::{e}")
          print(f"sitemap: {len(listed)} URLs, {len(pages)} indexable pages")
          sys.exit(1 if errors else 0)
          EOF
