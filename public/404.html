<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found · Penelope Paige</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <script defer data-domain="penpaigebooks.com" src="https://plausible.thompsonblack.us/js/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #120B1C;
      --border:     #3A1A28;
      --red:        #BF1D2F;
      --blue:       #5EC0E9;
      --cream:      #EDE0CC;
      --muted:      #8A7A96;
      --btn-bg:     #1C0E28;
      --btn-hover:  #261239;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 55% at 50% -5%, #2A0E1E 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 85% 100%, #1A0818 0%, transparent 60%);
      font-family: 'DM Sans', sans-serif;
      color: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.25rem 4rem;
    }

    .code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.5rem, 14vw, 5.5rem);
      line-height: 1;
      color: var(--red);
    }

    .tagline {
      font-size: clamp(0.65rem, 2.2vw, 0.78rem);
      font-weight: 500;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--blue);
      margin-top: 1.1rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      justify-content: center;
      margin: 1.6rem 0;
    }

    .divider-line {
      height: 1px;
      width: 48px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
    }

    .divider-mark { color: var(--red); font-size: 0.6rem; }

    .blurb {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.7;
    }

    .home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2.25rem;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.9rem 1.5rem;
      text-decoration: none;
      color: var(--cream);
      font-size: 0.95rem;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .home:hover {
      background: var(--btn-hover);
      border-color: var(--red);
      transform: translateY(-1px);
    }

    .home-arrow { color: var(--blue); font-size: 0.85rem; }

    @media (prefers-reduced-motion: reduce) {
      .home { transition: none; }
    }
  </style>
</head>
<body>

  <p class="code">404</p>
  <p class="tagline">Page not found</p>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-mark">✦</span>
    <span class="divider-line"></span>
  </div>

  <p class="blurb">
    Even the best plots lose a page or two.<br />
    This one isn't where you left it.
  </p>

  <a href="/" class="home">
    <span>Back to the good stuff</span>
    <span class="home-arrow">→</span>
  </a>

</body>
</html>
